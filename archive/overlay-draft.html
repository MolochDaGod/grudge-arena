<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grudge Studio — HUD Overlay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Rajdhani:wght@400;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
/*
  ═══════════════════════════════════════════════════════
  GRUDGE STUDIO — THREE-ERA HUD OVERLAY
  ═══════════════════════════════════════════════════════
  THREE ERAS:
    Warlords  — dark fantasy past  — warm gold/wood
    Nexus     — present sci-fi     — cyan neon/glass
    Armada    — military future    — red/dark angular
  ═══════════════════════════════════════════════════════
  TSX COMPONENT MAP:
    <EraSwitcher />              #era-switcher
    <FloatPanel id="skills" />   #panel-skills
    <FloatPanel id="char" />     #panel-char
    <FloatPanel id="inv" />      #panel-inv
    <HudBar />                   #ui-overlay-container
    <GwTooltip />                #gw-tooltip + GW_Tooltip
    setEra(era)                  exported fn — switches body class
  ═══════════════════════════════════════════════════════
*/

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

/* ── ERA THEME VARIABLES ── */
/* Default = Warlords (dark fantasy) */
:root {
  --primary:       #c5a059;
  --primary-dim:   rgba(197,160,89,.3);
  --primary-glow:  rgba(197,160,89,.6);
  --panel-bg:      linear-gradient(150deg,#1e140e 0%,#120c06 60%,#0f0805 100%);
  --panel-border:  2px solid rgba(197,160,89,.65);
  --panel-radius:  12px;
  --panel-shadow:  0 -8px 40px rgba(0,0,0,.9), 0 0 0 1px rgba(197,160,89,.08), inset 0 0 24px rgba(0,0,0,.4);
  --slot-bg:       #0a0603;
  --slot-border:   #3a2a14;
  --text:          #f5e2c1;
  --text-dim:      #9b7d52;
  --text-muted:    #6b5535;
  --font-ui:       'Cinzel', serif;
  --font-body:     Georgia, serif;
  --font-mono:     monospace;
  --nexus-blur:    0px;
  --clip-corner:   0px;
  --scan-lines:    0;
}

/* Nexus (present sci-fi) */
body.era-nexus {
  --primary:       #00d4ff;
  --primary-dim:   rgba(0,212,255,.22);
  --primary-glow:  rgba(0,212,255,.55);
  --panel-bg:      rgba(2,12,26,.88);
  --panel-border:  1px solid rgba(0,212,255,.5);
  --panel-radius:  5px;
  --panel-shadow:  0 0 0 1px rgba(0,212,255,.08), 0 8px 40px rgba(0,0,0,.97), inset 0 0 30px rgba(0,212,255,.03);
  --slot-bg:       rgba(0,8,24,.9);
  --slot-border:   rgba(0,212,255,.2);
  --text:          #c0eeff;
  --text-dim:      #4a8fa8;
  --text-muted:    #2a5a6e;
  --font-ui:       'Rajdhani', sans-serif;
  --font-body:     'Rajdhani', sans-serif;
  --font-mono:     'Share Tech Mono', monospace;
  --nexus-blur:    8px;
  --clip-corner:   0px;
  --scan-lines:    0;
}

/* Armada (military future) */
body.era-armada {
  --primary:       #ff2233;
  --primary-dim:   rgba(255,34,51,.18);
  --primary-glow:  rgba(255,34,51,.5);
  --panel-bg:      linear-gradient(150deg,#0c0808 0%,#080505 55%,#060303 100%);
  --panel-border:  1px solid rgba(255,34,51,.45);
  --panel-radius:  3px;
  --panel-shadow:  0 0 0 1px rgba(255,34,51,.07), 0 8px 32px rgba(0,0,0,.97);
  --slot-bg:       #050202;
  --slot-border:   rgba(255,34,51,.22);
  --text:          #e8cac8;
  --text-dim:      #885055;
  --text-muted:    #552830;
  --font-ui:       'Share Tech Mono', monospace;
  --font-body:     'Share Tech Mono', monospace;
  --font-mono:     'Share Tech Mono', monospace;
  --nexus-blur:    0px;
  --clip-corner:   8px;
  --scan-lines:    0.035;
}

body {
  background: transparent;
  margin: 0;
  overflow: hidden;
  font-family: var(--font-ui);
  color: var(--text);
}

/* Armada scan lines */
body.era-armada::after {
  content: '';
  position: fixed; inset: 0;
  background: repeating-linear-gradient(0deg,
    rgba(0,0,0,var(--scan-lines)) 0px, rgba(0,0,0,var(--scan-lines)) 1px,
    transparent 1px, transparent 3px);
  pointer-events: none;
  z-index: 99999;
}

/* ── OVERLAY CONTAINER ── */
#ui-overlay-container {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  pointer-events: none;
  z-index: 9999;
  display: flex;
  align-items: flex-end;
  gap: 8px;
  padding: 10px;
}
.ui-element { pointer-events: auto; }

/* ── HUD CHAT (flex-grows to fill available width) ── */
#hud-chat {
  flex: 1;
  min-width: 0;
  pointer-events: auto;
  padding: 8px 10px;
  display: flex;
  flex-direction: column;
  gap: 5px;
  min-height: 120px;
}

/* ── HUD HOTBAR WRAPPER ── */
#hud-hotbar {
  flex-shrink: 0;
  pointer-events: auto;
  display: flex;
  align-items: center;
  gap: 5px;
  padding: 8px 12px;
}

/* ── HUD STATUS COLUMN (right side) ── */
#hud-status-col {
  flex-shrink: 0;
  width: 215px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}

#hud-ics-row {
  display: flex;
  gap: 6px;
  justify-content: flex-end;
  padding-right: 4px;
}

#hud-status-panel {
  pointer-events: auto;
  width: 100%;
  display: flex;
  padding: 12px 10px 10px;
  gap: 0;
}

.hud-portrait-col {
  width: 52px;
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 5px;
}

#hud-portrait {
  width: 44px; height: 44px;
  border-radius: 6px;
  background: var(--slot-bg);
  border: 2px solid var(--primary);
  display: flex; align-items: center; justify-content: center;
  font-size: 24px; cursor: pointer;
  box-shadow: 0 0 12px var(--primary-glow);
  transition: .15s;
}
body.era-armada #hud-portrait {
  border-radius: 0;
  clip-path: polygon(0 0, calc(100% - 5px) 0, 100% 5px, 100% 100%, 5px 100%, 0 calc(100% - 5px));
}

.hud-info-col {
  flex: 1;
  margin-left: 9px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

/* ── PANEL BASE ── */
.panel-style {
  background: var(--panel-bg);
  border: var(--panel-border);
  border-radius: var(--panel-radius);
  box-shadow: var(--panel-shadow);
  position: relative;
  -webkit-backdrop-filter: blur(var(--nexus-blur));
  backdrop-filter: blur(var(--nexus-blur));
}

/* Warlords: gold rivet pins on panel corners */
body.era-warlords .panel-style::before,
body.era-warlords .panel-style::after {
  content: '';
  position: absolute;
  width: 5px; height: 5px;
  background: var(--primary);
  border-radius: 1px;
  box-shadow: 0 0 4px var(--primary-glow);
  z-index: 1;
}
body.era-warlords .panel-style::before { top: 3px; left: 3px; }
body.era-warlords .panel-style::after  { top: 3px; right: 3px; }

/* Nexus: corner bracket L-shapes */
body.era-nexus .panel-style::before,
body.era-nexus .panel-style::after {
  content: '';
  position: absolute;
  width: 9px; height: 9px;
  border-color: var(--primary);
  border-style: solid;
  z-index: 1;
}
body.era-nexus .panel-style::before { top: -1px; left: -1px; border-width: 1px 0 0 1px; }
body.era-nexus .panel-style::after  { bottom: -1px; right: -1px; border-width: 0 1px 1px 0; }

/* Armada: angled clip corner */
body.era-armada .panel-style {
  clip-path: polygon(0 0, calc(100% - var(--clip-corner)) 0, 100% var(--clip-corner), 100% 100%, var(--clip-corner) 100%, 0 calc(100% - var(--clip-corner)));
}

/* ── ERA SWITCHER ── */
#era-switcher {
  position: fixed;
  top: 12px; right: 12px;
  display: flex; gap: 3px;
  z-index: 99999;
  pointer-events: auto;
  padding: 5px 6px;
}
.era-btn {
  padding: 5px 13px;
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1px;
  border-radius: calc(var(--panel-radius) - 2px);
  border: 1px solid transparent;
  cursor: pointer;
  font-family: var(--font-ui);
  background: transparent;
  color: var(--text-muted);
  transition: all .15s;
}
.era-btn:hover { color: var(--primary); border-color: var(--primary-dim); }
.era-btn.active {
  color: #0a0603;
  background: var(--primary);
  border-color: var(--primary);
  box-shadow: 0 0 10px var(--primary-glow);
}
body.era-nexus .era-btn.active  { color: #020c1a; }
body.era-armada .era-btn.active { color: #0c0808; }

/* ── ERA WATERMARK ── */
#era-label {
  position: fixed;
  top: 50px; right: 12px;
  font-family: var(--font-mono);
  font-size: 9px; letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--text-muted);
  pointer-events: none; opacity: .55;
  z-index: 99998; text-align: right;
}

/* ── HOTBAR ── */
.hotbar-slot {
  width: 48px; height: 48px;
  background: var(--slot-bg);
  border: 2px solid var(--slot-border);
  border-radius: calc(var(--panel-radius) / 2);
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; position: relative; cursor: pointer;
  transition: all .12s; font-family: var(--font-mono);
}
body.era-armada .hotbar-slot {
  border-radius: 0;
  clip-path: polygon(0 0, calc(100% - 5px) 0, 100% 5px, 100% 100%, 5px 100%, 0 calc(100% - 5px));
}
.hotbar-slot:hover { border-color: var(--primary); box-shadow: 0 0 12px var(--primary-glow); transform: scale(1.06); }
.hotbar-slot.pressed { transform: scale(.88); border-color: var(--primary); box-shadow: inset 0 0 12px var(--primary-dim); }
.hotbar-num { position: absolute; top: 2px; left: 4px; font-size: 10px; color: var(--text-muted); font-family: var(--font-mono); line-height: 1; }

/* ── CIRCLE BUTTONS (I/C/S) ── */
.circle-btn {
  width: 36px; height: 36px; border-radius: 50%;
  background: var(--slot-bg); border: 2px solid var(--primary);
  display: flex; align-items: center; justify-content: center;
  color: var(--primary); font-weight: bold; font-size: 13px;
  box-shadow: 0 4px 8px rgba(0,0,0,.5);
  cursor: pointer; transition: all .15s; font-family: var(--font-ui);
}
.circle-btn:hover { background: var(--primary-dim); box-shadow: 0 0 14px var(--primary-glow); }
.circle-btn.active { background: var(--primary-dim); box-shadow: 0 0 20px var(--primary-glow); }
body.era-armada .circle-btn { border-radius: 3px; }

/* ── FLOATING PANELS ── */
.float-panel {
  position: fixed; right: 10px; bottom: 165px; width: 315px;
  display: none; flex-direction: column; overflow: hidden; z-index: 9998;
  background: var(--panel-bg); border: var(--panel-border);
  border-radius: var(--panel-radius); box-shadow: var(--panel-shadow);
  -webkit-backdrop-filter: blur(var(--nexus-blur));
  backdrop-filter: blur(var(--nexus-blur));
}
body.era-armada .float-panel {
  clip-path: polygon(0 0, calc(100% - var(--clip-corner)) 0, 100% var(--clip-corner), 100% 100%, var(--clip-corner) 100%, 0 calc(100% - var(--clip-corner)));
}
.float-panel.active { display: flex; animation: fp-in .18s ease; }
@keyframes fp-in { from { opacity:0; transform:translateY(8px) scale(.98); } to { opacity:1; transform:none; } }

.fp-header {
  display: flex; justify-content: space-between; align-items: center;
  padding: 10px 14px;
  background: linear-gradient(90deg, var(--primary-dim), transparent 70%);
  border-bottom: 1px solid var(--primary-dim); flex-shrink: 0;
}
.fp-title {
  font-family: var(--font-ui); font-size: 11px; font-weight: 700;
  color: var(--primary); text-transform: uppercase; letter-spacing: 2px;
}
body.era-warlords .fp-title::before { content: "⚜  "; opacity: .5; font-size: 9px; }
body.era-nexus   .fp-title::before { content: "◈  "; opacity: .5; font-size: 9px; }
body.era-armada  .fp-title::before { content: "▶  "; opacity: .5; font-size: 9px; }

.fp-close {
  color: var(--text-muted); cursor: pointer; font-size: 14px;
  width: 22px; height: 22px; display: flex; align-items: center; justify-content: center;
  border-radius: 50%; transition: .15s;
}
.fp-close:hover { color: var(--primary); background: var(--primary-dim); }

/* Entity tabs */
.entity-tabs { display: flex; gap: 3px; padding: 6px 8px; border-bottom: 1px solid var(--primary-dim); flex-shrink: 0; }
.entity-tab {
  padding: 4px 10px; font-size: 10px; border-radius: calc(var(--panel-radius) / 2);
  cursor: pointer; font-family: var(--font-ui); color: var(--text-muted);
  font-weight: 600; text-transform: uppercase; letter-spacing: .8px;
  border: 1px solid transparent; transition: .12s;
}
body.era-armada .entity-tab { border-radius: 0; }
.entity-tab:hover { color: var(--primary); border-color: var(--primary-dim); }
.entity-tab.active { color: var(--slot-bg); background: var(--primary); border-color: var(--primary); }

.fp-body { overflow-y: auto; flex: 1; padding: 10px; max-height: 350px; }
.fp-body::-webkit-scrollbar { width: 2px; }
.fp-body::-webkit-scrollbar-thumb { background: var(--primary-dim); }

/* ── SKILLS GRID ── */
.skill-slot-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; padding: 10px; }
.sk-slot {
  aspect-ratio: 1; background: var(--slot-bg); border: 1px solid var(--slot-border);
  border-radius: calc(var(--panel-radius) / 2);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 3px; cursor: pointer; transition: .15s; position: relative; overflow: hidden; font-size: 22px;
}
body.era-armada .sk-slot { border-radius: 0; }
.sk-slot:hover { border-color: var(--primary); box-shadow: 0 0 10px var(--primary-glow); }
.sk-slot.active { border-color: var(--primary); background: var(--primary-dim); }
.sk-label { font-size: 8px; color: var(--text-dim); text-align: center; line-height: 1.2; font-family: var(--font-body); }
.sk-num { position: absolute; top: 3px; left: 5px; font-size: 9px; color: var(--text-muted); font-family: var(--font-mono); }

/* ── CHARACTER PANEL ── */
.char-header {
  display: flex; gap: 12px; align-items: flex-start;
  padding-bottom: 12px; border-bottom: 1px solid var(--primary-dim); margin-bottom: 10px;
}
.char-portrait {
  width: 56px; height: 56px; flex-shrink: 0;
  border: 2px solid var(--primary); border-radius: calc(var(--panel-radius) / 2);
  display: flex; align-items: center; justify-content: center; font-size: 28px;
  background: var(--slot-bg); box-shadow: 0 0 14px var(--primary-glow);
}
body.era-armada .char-portrait {
  border-radius: 0;
  clip-path: polygon(0 0, calc(100% - 5px) 0, 100% 5px, 100% 100%, 5px 100%, 0 calc(100% - 5px));
}
.char-name { font-family: var(--font-ui); font-size: 15px; font-weight: 700; color: var(--primary); }
.char-sub { font-size: 9px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; margin-top: 2px; }
.char-bars { display: flex; flex-direction: column; gap: 4px; margin-top: 6px; }
.char-bar-row { display: flex; align-items: center; gap: 6px; }
.char-bar-label { font-size: 9px; color: var(--text-muted); width: 22px; font-family: var(--font-mono); text-transform: uppercase; }
.char-bar-track { flex: 1; height: 5px; background: rgba(0,0,0,.5); border-radius: 3px; overflow: hidden; border: 1px solid rgba(255,255,255,.05); }
body.era-armada .char-bar-track { border-radius: 0; border: 1px solid var(--slot-border); }
.char-bar-fill { height: 100%; border-radius: 3px; transition: width .4s; }
body.era-armada .char-bar-fill { border-radius: 0; }
.char-bar-val { font-size: 9px; color: var(--text-dim); font-family: var(--font-mono); white-space: nowrap; }
.char-stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; padding: 2px; }
.csg-cell {
  background: rgba(0,0,0,.3); border: 1px solid var(--primary-dim); border-radius: 5px;
  padding: 7px 4px; display: flex; flex-direction: column; align-items: center; gap: 2px;
  cursor: default; transition: .12s;
}
body.era-armada .csg-cell { border-radius: 0; }
.csg-cell:hover { border-color: var(--primary); background: var(--primary-dim); }
.csg-val { font-family: var(--font-mono); font-size: 15px; font-weight: 700; color: var(--text); }
.csg-key { font-size: 8px; color: var(--text-muted); text-transform: uppercase; letter-spacing: .5px; }
.open-full-btn {
  width: 100%; margin-top: 10px; padding: 8px;
  background: transparent; border: 1px solid var(--primary-dim);
  border-radius: calc(var(--panel-radius) / 2);
  color: var(--primary); font-family: var(--font-ui);
  font-size: 10px; text-transform: uppercase; letter-spacing: 1px;
  cursor: pointer; transition: .15s;
}
body.era-armada .open-full-btn {
  border-radius: 0;
  clip-path: polygon(0 0, calc(100% - 5px) 0, 100% 5px, 100% 100%, 5px 100%, 0 calc(100% - 5px));
}
.open-full-btn:hover { background: var(--primary-dim); box-shadow: 0 0 12px var(--primary-glow); }

/* ── INVENTORY ── */
.mini-inv-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; }
.mi-cell {
  aspect-ratio: 1; background: rgba(0,0,0,.4); border: 1px solid rgba(255,255,255,.05);
  border-radius: 4px; display: flex; align-items: center; justify-content: center;
  font-size: 18px; position: relative; cursor: default; transition: .12s;
}
body.era-armada .mi-cell { border-radius: 0; }
.mi-cell.filled { cursor: pointer; border-color: var(--primary-dim); }
.mi-cell.filled:hover { border-color: var(--primary); box-shadow: 0 0 8px var(--primary-glow); transform: scale(1.07); }
.mq { position: absolute; bottom: 1px; right: 3px; font-size: 9px; color: var(--text-dim); font-family: var(--font-mono); font-weight: 700; }

/* ── CHAT ── */
.chat-log { flex: 1; min-height: 60px; overflow-y: auto; font-size: 11px; color: var(--text-dim); font-family: var(--font-body); }
.chat-log::-webkit-scrollbar { width: 2px; }
.chat-log::-webkit-scrollbar-thumb { background: var(--primary-dim); }
.chat-input {
  width: 100%; background: rgba(0,0,0,.5); border: 1px solid var(--primary-dim);
  border-radius: calc(var(--panel-radius) / 2); padding: 4px 8px;
  color: var(--text); font-size: 11px; font-family: var(--font-body); outline: none; transition: border-color .15s;
}
body.era-armada .chat-input { border-radius: 0; }
.chat-input:focus { border-color: var(--primary); }

/* ── HUD MINI BARS ── */
.hud-bar-track { width: 100%; height: 3px; border-radius: 2px; overflow: hidden; }
body.era-armada .hud-bar-track { border-radius: 0; }
.hud-bar-fill { height: 100%; border-radius: 2px; transition: width .4s; }
body.era-armada .hud-bar-fill { border-radius: 0; }
.hud-bar-hp { background: rgba(200,0,0,.2); }
.hud-bar-mp { background: rgba(0,60,200,.2); }
.hud-bar-sp { background: rgba(100,160,0,.2); }
.hud-fill-hp { background: #d00; width: 78%; }
.hud-fill-mp { background: #38f; width: 62%; }
.hud-fill-sp { background: #8b0; width: 91%; }

/* ── HUD STATUS PANEL INTERNALS ── */
.hud-name {
  color: var(--primary); font-family: var(--font-ui); font-weight: 700; font-size: 11px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.hud-class-row {
  color: var(--text-muted); font-size: 9px; margin-top: 1px;
  text-transform: uppercase; letter-spacing: .8px; font-family: var(--font-mono);
}
.hud-divider { border-top: 1px solid var(--primary-dim); margin: 6px 0 4px; }
.hud-equipped-label {
  font-size: 8px; color: var(--text-muted); text-transform: uppercase;
  letter-spacing: .5px; margin-bottom: 3px; font-family: var(--font-mono);
}
#hud-gear {
  display: flex; flex-direction: column; gap: 2px;
  font-size: 10px; line-height: 1.4; color: var(--text-dim); font-family: var(--font-body);
}

/* ── TOOLTIP ENGINE ── */
#gw-tooltip {
  position: fixed; z-index: 99999; pointer-events: none;
  opacity: 0; transform: translateY(6px) scale(.97);
  transition: opacity .13s ease, transform .13s ease;
  max-width: 270px; min-width: 172px;
  background: var(--panel-bg); border: var(--panel-border);
  border-radius: var(--panel-radius); box-shadow: var(--panel-shadow);
  overflow: hidden; font-family: var(--font-ui); color: var(--text);
  -webkit-backdrop-filter: blur(var(--nexus-blur));
  backdrop-filter: blur(var(--nexus-blur));
}
body.era-armada #gw-tooltip {
  clip-path: polygon(0 0, calc(100% - var(--clip-corner)) 0, 100% var(--clip-corner), 100% 100%, var(--clip-corner) 100%, 0 calc(100% - var(--clip-corner)));
}
#gw-tooltip.show { opacity: 1; transform: translateY(0) scale(1); }
/* Warlords gold pin */
body.era-warlords #gw-tooltip::before {
  content: ''; position: absolute; top: 3px; left: 3px;
  width: 5px; height: 5px; background: var(--primary); border-radius: 1px;
  box-shadow: 0 0 4px var(--primary-glow); z-index: 1;
}

          <div class="char-bar-row">
            <span class="char-bar-label">HP</span>
            <div class="char-bar-track"><div class="char-bar-fill" style="width:${pct(e.hp)}%;background:#d00;"></div></div>
            <span class="char-bar-val">${e.hp[0]}/${e.hp[1]}</span>
          </div>
          <div class="char-bar-row">
            <span class="char-bar-label">MP</span>
            <div class="char-bar-track"><div class="char-bar-fill" style="width:${pct(e.mp)}%;background:#38f;"></div></div>
            <span class="char-bar-val">${e.mp[0]}/${e.mp[1]}</span>
          </div>
          <div class="char-bar-row">
            <span class="char-bar-label">SP</span>
            <div class="char-bar-track"><div class="char-bar-fill" style="width:${pct(e.sp)}%;background:#8b0;"></div></div>
            <span class="char-bar-val">${e.sp[0]}/${e.sp[1]}</span>
          </div>
        </div>
      </div>
    </div>
    <div class="char-stats-grid">
      ${['STR','INT','VIT','DEX','END','WIS','AGI','TAC'].map(k => `
        <div class="csg-cell">
          <div class="csg-val">${e.stats[k] || 0}</div>
          <div class="csg-key">${k}</div>
        </div>`).join('')}
    </div>
    <button class="open-full-btn" onclick="window.open('mainpanel.html','_blank')">⚔ Open Full Character Panel</button>`;
}

function _renderInv() {
  const e = getEntity();
  const body = document.getElementById('mini-inv-body'); if (!body) return;
  const SLOTS = 15;
  const items = e.inventory || [];
  const gold  = e.type === 'enemy' ? 0 : (12450 + e.level * 100);
  let html = `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
      <span style="font-size:9px;color:var(--text-muted);text-transform:uppercase;letter-spacing:1px;font-family:var(--font-ui);">Items (${items.length}/${SLOTS})</span>
      <span style="font-size:10px;color:var(--primary);font-family:var(--font-mono);">⚜ ${gold.toLocaleString()}</span>
    </div>
    <div class="mini-inv-grid">`;
  for (let i = 0; i < SLOTS; i++) {
    const item = items[i];
    if (item) {
      const rc = RARITY_COLOR[item.rarity] || '#888';
      html += `<div class="mi-cell filled" style="border-color:${rc}60;">${item.emoji}${item.qty > 1 ? `<span class="mq">${item.qty}</span>` : ''}</div>`;
    } else {
      html += '<div class="mi-cell"></div>';
    }
  }
  html += '</div>';
  body.innerHTML = html;
}

function _updateHUD() {
  const e = getEntity();
  document.getElementById('hud-portrait').textContent = e.emoji;
  document.getElementById('hud-name').textContent     = e.name;
  document.getElementById('hud-class').textContent    = `Lv.${e.level} ${e.class}`;
  document.getElementById('hud-hp').style.width = (e.hp[0] / Math.max(e.hp[1], 1) * 100) + '%';
  document.getElementById('hud-mp').style.width = (e.mp[0] / Math.max(e.mp[1], 1) * 100) + '%';
  document.getElementById('hud-sp').style.width = (e.sp[0] / Math.max(e.sp[1], 1) * 100) + '%';
}

// ── CHAT ──
const HUD = {
  sendChat(evt) {
    if (evt.key !== 'Enter') return;
    const inp = document.getElementById('chat-input');
    const msg = inp.value.trim(); if (!msg) return;
    const log = document.getElementById('chat-log');
    const d = document.createElement('div');
    d.style.cssText = 'color:var(--text);font-size:11px;padding:1px 0;';
    d.textContent = `[You]: ${msg}`;
    log.appendChild(d); log.scrollTop = log.scrollHeight; inp.value = '';
  }
};

// ── postMessage GAME API ──
window.addEventListener('message', ev => {
  const { action, data } = ev.data || {};
  if (action === 'selectEntity' && data?.id) {
    if (!ENTITIES[data.id] && typeof data === 'object') ENTITIES[data.id] = data;
    selectEntity(data.id);
  }
  if (action === 'updateEntity' && data?.id && ENTITIES[data.id]) {
    Object.assign(ENTITIES[data.id], data);
    PanelMgr._renderActive(); _updateHUD();
  }
  if (action === 'setEra' && data?.era) {
    const btn = document.querySelector(`.era-btn[data-era="${data.era}"]`);
    if (btn) setEra(data.era, btn);
  }
});

// ── TOOLTIP ENGINE ──
const GW_Tooltip = {
  el: null, _timer: null,

  init() {
    this.el = document.getElementById('gw-tooltip');
    document.addEventListener('mousemove', e => this._pos(e), { passive: true });
    this._bindStatic();
    this._bindDelegated();
  },

  _pos(e) {
    if (!this.el?.classList.contains('show')) return;
    const PAD = 12, tw = this.el.offsetWidth, th = this.el.offsetHeight;
    const vw = window.innerWidth, vh = window.innerHeight;
    let x = e.clientX + 18, y = e.clientY - 10;
    if (x + tw > vw - PAD) x = e.clientX - tw - 14;
    if (y + th > vh - PAD) y = vh - th - PAD;
    if (y < PAD) y = PAD;
    this.el.style.left = x + 'px'; this.el.style.top = y + 'px';
  },

  show(html, delay = 70) {
    clearTimeout(this._timer);
    this._timer = setTimeout(() => {
      if (this.el) { this.el.innerHTML = html; this.el.classList.add('show'); }
    }, delay);
  },

  hide() { clearTimeout(this._timer); this.el?.classList.remove('show'); },

  skill(sk) {
    if (!sk?.name) return this.simple('Empty Slot', 'No skill assigned to this slot.');
    const m = SKILL_META[sk.name] || { desc:'No description.', cost:'—', cd:'—', type:'active', tags:[] };
    const typeLabel = { active:'Active Ability', passive:'Passive Ability' }[m.type] || 'Ultimate';
    const tags = (m.tags || []).map(t => `<span class="tt-tag type-${t}">${t}</span>`).join('');
    return `
      <div class="tt-header">
        <div class="tt-icon">${sk.icon || '?'}</div>
        <div><div class="tt-title">${sk.name}</div><div class="tt-subtitle">${typeLabel}</div></div>
      </div>
      <div class="tt-body">
        <div class="tt-desc">${m.desc}</div>
        ${(m.cost !== '—' || m.cd !== '—') ? `<div class="tt-stats">
          ${m.cost !== '—' ? `<div class="tt-stat-row"><span class="ts-key">Cost</span><span class="ts-val">${m.cost}</span></div>` : ''}
          ${m.cd   !== '—' ? `<div class="tt-stat-row"><span class="ts-key">Cooldown</span><span class="ts-val">${m.cd}</span></div>` : ''}
        </div>` : ''}
        ${tags ? `<div class="tt-tags">${tags}</div>` : ''}
      </div>`;
  },

  item(item) {
    if (!item?.name) return this.simple('Empty', 'No item in this slot.');
    const m = ITEM_META[item.name] || { desc: item.name, type:(item.rarity||'common')+' item', stats:[] };
    const rc = RARITY_COLOR[item.rarity] || '#888';
    const stats = (m.stats || []).map(s => `<div class="tt-stat-row"><span class="ts-val pos">${s}</span></div>`).join('');
    return `
      <div class="tt-rarity" style="background:${rc}"></div>
      <div class="tt-header">
        <div class="tt-icon">${item.emoji || '⬡'}</div>
        <div>
          <div class="tt-title" style="color:${rc}">${item.name}</div>
          <div class="tt-subtitle">${m.type}</div>
          ${item.qty > 1 ? `<div style="font-size:9px;color:var(--text-muted);margin-top:2px">Qty: <span style="color:var(--primary);font-family:var(--font-mono)">${item.qty}</span></div>` : ''}
        </div>
      </div>
      <div class="tt-body">
        <div class="tt-desc">${m.desc}</div>
        ${stats ? `<div class="tt-stats">${stats}</div>` : ''}
      </div>`;
  },

  stat(key, val) {
    const m = STAT_META[key] || { name:key, desc:'An attribute that affects character performance.', color:'#888' };
    return `
      <div class="tt-header">
        <div class="tt-icon" style="font-size:12px;font-weight:700;color:${m.color};font-family:var(--font-ui)">${key}</div>
        <div><div class="tt-title" style="color:${m.color}">${m.name}</div><div class="tt-subtitle">Base Attribute</div></div>
      </div>
      <div class="tt-body">
        <div class="tt-desc">${m.desc}</div>
        <div class="tt-stats"><div class="tt-stat-row"><span class="ts-key">Value</span><span class="ts-val pos">${val}</span></div></div>
      </div>`;
  },

  button(label, desc, key) {
    return `
      <div class="tt-header"><div><div class="tt-title">${label}</div><div class="tt-subtitle">Panel Toggle</div></div></div>
      <div class="tt-body"><div class="tt-desc">${desc}</div></div>
      <div class="tt-keybind"><span class="tt-key">${key}</span><span>Press to toggle</span></div>`;
  },

  hotbar(sk, keyNum) {
    if (!sk?.name) return this.simple(`Slot ${keyNum}`, 'This hotbar slot is empty.');
    const m = SKILL_META[sk.name] || { desc:'No description.', cost:'—', cd:'—', tags:[] };
    const tags = (m.tags || []).map(t => `<span class="tt-tag type-${t}">${t}</span>`).join('');
    return `
      <div class="tt-header">
        <div class="tt-icon">${sk.icon || '?'}</div>
        <div><div class="tt-title">${sk.name}</div><div class="tt-subtitle">Hotbar Skill</div></div>
      </div>
      <div class="tt-body">
        <div class="tt-desc">${m.desc}</div>
        ${(m.cost !== '—' || m.cd !== '—') ? `<div class="tt-stats">
          ${m.cost !== '—' ? `<div class="tt-stat-row"><span class="ts-key">Cost</span><span class="ts-val">${m.cost}</span></div>` : ''}
          ${m.cd   !== '—' ? `<div class="tt-stat-row"><span class="ts-key">Cooldown</span><span class="ts-val">${m.cd}</span></div>` : ''}
        </div>` : ''}
        ${tags ? `<div class="tt-tags">${tags}</div>` : ''}
      </div>
      <div class="tt-keybind"><span class="tt-key">${keyNum}</span><span>Activate</span></div>`;
  },

  resource(label, cur, max, color) {
    const pct = Math.round(cur / Math.max(max, 1) * 100);
    const cls = pct < 25 ? 'neg' : pct >= 60 ? 'pos' : '';
    return `
      <div class="tt-header"><div><div class="tt-title" style="color:${color}">${label}</div><div class="tt-subtitle">Resource</div></div></div>
      <div class="tt-body"><div class="tt-stats">
        <div class="tt-stat-row"><span class="ts-key">Current</span><span class="ts-val pos">${cur}</span></div>
        <div class="tt-stat-row"><span class="ts-key">Maximum</span><span class="ts-val">${max}</span></div>
        <div class="tt-stat-row"><span class="ts-key">Fill</span><span class="ts-val ${cls}">${pct}%</span></div>
      </div></div>`;
  },

  simple(title, desc) {
    return `<div class="tt-header"><div><div class="tt-title">${title}</div></div></div>
            <div class="tt-body"><div class="tt-desc">${desc}</div></div>`;
  },

  _on(el, buildFn) {
    el.addEventListener('mouseenter', () => this.show(buildFn()));
    el.addEventListener('mouseleave', () => this.hide());
  },

  _bindStatic() {
    const T = this;
    const HOTBAR_SKILLS = [
      {name:'Power Strike',icon:'⚔'}, {name:'Shield Bash',icon:'🛡'},
      {name:'War Cry',icon:'📯'},      {name:'Cleave',icon:'💥'},
      null, null, null, null
    ];
    document.querySelectorAll('.hotbar-slot').forEach((slot, i) => {
      T._on(slot, () => T.hotbar(HOTBAR_SKILLS[i] || null, slot.dataset.key));
    });
    const BTN_DATA = {
      'panel-inv':    ['Inventory',  'Browse your items, equipment, and materials.', 'I'],
      'panel-char':   ['Character',  'View stats, attributes, and resource bars.',   'C'],
      'panel-skills': ['Skills',     'Manage your active skill slots.',              'S'],
    };
    document.querySelectorAll('.circle-btn').forEach(btn => {
      const d = BTN_DATA[btn.dataset.panel];
      if (d) T._on(btn, () => T.button(d[0], d[1], d[2]));
    });
    const BAR_DEFS = [
      ['hud-hp', 'Hit Points (HP)',    'hp', '#d44040'],
      ['hud-mp', 'Mana Points (MP)',   'mp', '#3a7ad8'],
      ['hud-sp', 'Stamina Points (SP)','sp', '#8ab020'],
    ];
    BAR_DEFS.forEach(([id, label, key, color]) => {
      const bar  = document.getElementById(id);
      const wrap = bar?.parentElement;
      if (wrap) T._on(wrap, () => {
        const e = getEntity();
        return e ? T.resource(label, e[key][0], e[key][1], color) : T.simple(label, '');
      });
    });
  },

  _bindDelegated() {
    const T = this;
    const skillGrid = document.getElementById('skill-slot-grid');
    skillGrid.addEventListener('mouseover', e => {
      const slot = e.target.closest('.sk-slot'); if (!slot) return;
      const idx = Array.from(slot.parentElement.children).indexOf(slot);
      T.show(T.skill(getEntity()?.skills?.[idx]));
    });
    skillGrid.addEventListener('mouseleave', () => T.hide());

    const invBody = document.getElementById('mini-inv-body');
    invBody.addEventListener('mouseover', e => {
      const cell = e.target.closest('.mi-cell');
      if (!cell?.classList.contains('filled')) return;
      const idx = Array.from(cell.parentElement.children).indexOf(cell);
      T.show(T.item(getEntity()?.inventory?.[idx]));
    });
    invBody.addEventListener('mouseleave', () => T.hide());

    const charBody = document.getElementById('char-panel-body');
    charBody.addEventListener('mouseover', e => {
      const cell = e.target.closest('.csg-cell'); if (!cell) return;
      const key = cell.querySelector('.csg-key')?.textContent?.trim();
      const val = cell.querySelector('.csg-val')?.textContent?.trim();
      if (key && val) T.show(T.stat(key, val));
    });
    charBody.addEventListener('mouseleave', () => T.hide());
  }
};

// ── INIT ──
_updateHUD();
GW_Tooltip.init();
window.parent.postMessage({ action: 'ready' }, '*');
</script>
