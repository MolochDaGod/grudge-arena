<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Grudge Arena · Animation Test</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box
        }

        body {
            background: #0a0a0f;
            color: #e8dcc8;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            overflow: hidden
        }

        #toolbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 10;
            display: flex;
            gap: 8px;
            align-items: center;
            padding: 8px 12px;
            background: rgba(0, 0, 0, 0.75);
            border-bottom: 1px solid rgba(201, 168, 76, 0.3);
            backdrop-filter: blur(8px)
        }

        #toolbar a {
            color: #c9a84c;
            text-decoration: none;
            font-size: 11px;
            letter-spacing: 0.1em;
            text-transform: uppercase
        }

        #toolbar select,
        #toolbar button {
            background: rgba(20, 20, 30, 0.9);
            color: #e8dcc8;
            border: 1px solid rgba(201, 168, 76, 0.4);
            border-radius: 4px;
            padding: 5px 10px;
            font-size: 11px;
            font-family: inherit;
            cursor: pointer
        }

        #toolbar select:hover,
        #toolbar button:hover {
            border-color: #c9a84c
        }

        #toolbar .label {
            color: rgba(232, 220, 200, 0.6);
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.1em
        }

        #toolbar .spacer {
            flex: 1
        }

        #toolbar #anim-name {
            color: #c9a84c;
            font-weight: 700;
            font-size: 12px;
            min-width: 140px
        }

        #stage {
            position: fixed;
            inset: 42px 0 0 0;
            display: flex
        }

        #log {
            width: 42%;
            padding: 14px;
            font-family: ui-monospace, Consolas, monospace;
            font-size: 10.5px;
            color: #5fcf7a;
            background: #06060a;
            overflow-y: auto;
            white-space: pre-wrap;
            border-right: 1px solid rgba(201, 168, 76, 0.2)
        }

        #canvas-wrap {
            flex: 1;
            position: relative
        }

        #canvas-wrap canvas {
            display: block
        }
    </style>
</head>

<body>

<div id="toolbar">
    <a href="/">← Arena</a>
    <span class="label">Race</span>
    <select id="race-sel"></select>
    <span class="label">Clip</span>
    <select id="anim-sel">
        <option value="">— cycling —</option>
    </select>
    <button id="prev-btn">◀ Prev</button>
    <button id="next-btn">Next ▶</button>
    <button id="cycle-btn" title="Auto-cycle every 3s">⏯ Auto</button>
    <span class="spacer"></span>
    <span id="anim-name">loading…</span>
</div>

<div id="stage">
    <div id="log"></div>
    <div id="canvas-wrap"></div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const RACES = ['barbarian', 'dwarf', 'elf', 'human', 'orc', 'undead'];
    const params = new URLSearchParams(location.search);
    const initialRace = RACES.includes(params.get('race')) ? params.get('race') : 'human';
    const initialWeapon = params.get('weapon') || '';

    const logEl = document.getElementById('log');
    const animNameEl = document.getElementById('anim-name');
    const raceSel = document.getElementById('race-sel');
    const animSel = document.getElementById('anim-sel');
    RACES.forEach(r => {
        const opt = document.createElement('option');
        opt.value = r; opt.textContent = r[0].toUpperCase() + r.slice(1);
        if (r === initialRace) opt.selected = true;
        raceSel.appendChild(opt);
    });
    const log = (m) => { logEl.textContent += m + '\n'; logEl.scrollTop = logEl.scrollHeight; };

    const wrap = document.getElementById('canvas-wrap');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x1a1a2e);
    const camera = new THREE.PerspectiveCamera(45, 1, 0.05, 100);
    camera.position.set(0, 1.4, 3.2);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    wrap.appendChild(renderer.domElement);
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 1.0, 0);
    scene.add(new THREE.AmbientLight(0xffffff, 0.7));
    const dir = new THREE.DirectionalLight(0xffffff, 1.1);
    dir.position.set(3, 5, 2); scene.add(dir);
    const ground = new THREE.Mesh(new THREE.CircleGeometry(4, 48), new THREE.MeshStandardMaterial({ color: 0x2a2a3a }));
    ground.rotation.x = -Math.PI / 2; scene.add(ground);

    function resize() { const w = wrap.clientWidth, h = wrap.clientHeight; camera.aspect = w / h; camera.updateProjectionMatrix(); renderer.setSize(w, h, false); }
    window.addEventListener('resize', resize); resize();

    const loader = new GLTFLoader();
    const clock = new THREE.Clock();
    let mixer = null, currentChar = null, currentBones = [], libraryClips = [], cycleTimer = null, cycleIdx = 0, autoCycle = true;

    function setActiveClip(clip) {
        if (!mixer || !clip) return;
        mixer.stopAllAction();
        const action = mixer.clipAction(clip, currentChar);
        action.setLoop(THREE.LoopRepeat, Infinity);
        action.reset().play();
        animNameEl.textContent = clip.name;
        log('▶ ' + clip.name);
}
    function startCycle() { stopCycle(); if (!libraryClips.length) return; cycleTimer = setInterval(() => { cycleIdx = (cycleIdx + 1) % libraryClips.length; setActiveClip(libraryClips[cycleIdx]); animSel.value = libraryClips[cycleIdx].name; }, 3000); }
    function stopCycle() { if (cycleTimer) { clearInterval(cycleTimer); cycleTimer = null; } }

    async function loadRace(race) {
        stopCycle();
        if (currentChar) scene.remove(currentChar);
        mixer = null; currentChar = null; currentBones = []; libraryClips = []; animSel.innerHTML = '<option value="">— cycling —</option>';
        log('\n=== ' + race.toUpperCase() + ' ===' + (initialWeapon ? (' / ' + initialWeapon) : ''));
        log('1. /models/' + race + '.glb');
  try {
        const gltf = await new Promise((res, rej) => loader.load('/models/' + race + '.glb', res, undefined, rej));
        currentChar = gltf.scene; scene.add(currentChar);
        log('  scale: ' + currentChar.scale.toArray().map(v => v.toFixed(3)).join(','));
        currentChar.traverse(n => { if (n.isBone) currentBones.push(n.name); });
        log('  bones: ' + currentBones.length + (gltf.animations.length ? (' · embedded clips: ' + gltf.animations.length) : ' · no embedded clips'));
        mixer = new THREE.AnimationMixer(currentChar);
        log('2. /models/animation-library.glb');
        const lib = await new Promise((res, rej) => loader.load('/models/animation-library.glb', res, undefined, rej));
        libraryClips = lib.animations;
        log('  clips: ' + libraryClips.length);
        libraryClips.forEach(c => { const o = document.createElement('option'); o.value = c.name; o.textContent = c.name; animSel.appendChild(o); });
        const boneSet = new Set(currentBones);
        const sample = libraryClips.find(a => a.name === 'idle') || libraryClips[0];
        if (sample) {
            let matched = 0; for (const t of sample.tracks) { const b = t.name.split('.')[0]; if (boneSet.has(b)) matched++; }
            log('  idle clip: ' + matched + '/' + sample.tracks.length + ' bones bound');
            cycleIdx = libraryClips.indexOf(sample);
            setActiveClip(sample); animSel.value = sample.name;
        }
        if (autoCycle) startCycle();
    } catch (e) { log('FAIL: ' + e.message); animNameEl.textContent = 'error'; }
}

    raceSel.addEventListener('change', () => loadRace(raceSel.value));
    animSel.addEventListener('change', () => { const c = libraryClips.find(x => x.name === animSel.value); if (c) { stopCycle(); cycleIdx = libraryClips.indexOf(c); setActiveClip(c); } });
    document.getElementById('prev-btn').addEventListener('click', () => { if (!libraryClips.length) return; stopCycle(); cycleIdx = (cycleIdx - 1 + libraryClips.length) % libraryClips.length; setActiveClip(libraryClips[cycleIdx]); animSel.value = libraryClips[cycleIdx].name; });
    document.getElementById('next-btn').addEventListener('click', () => { if (!libraryClips.length) return; stopCycle(); cycleIdx = (cycleIdx + 1) % libraryClips.length; setActiveClip(libraryClips[cycleIdx]); animSel.value = libraryClips[cycleIdx].name; });
    document.getElementById('cycle-btn').addEventListener('click', () => { autoCycle = !autoCycle; if (autoCycle) startCycle(); else stopCycle(); document.getElementById('cycle-btn').style.borderColor = autoCycle ? '#5fcf7a' : ''; });

    (function tick() { requestAnimationFrame(tick); const dt = clock.getDelta(); if (mixer) mixer.update(dt); controls.update(); renderer.render(scene, camera); })();
    loadRace(initialRace);
</script>
</body>
</html>
