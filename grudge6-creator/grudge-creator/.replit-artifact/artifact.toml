kind = "web"
previewPath = "/grudge-creator/"
title = "Grudge Warlords Character Creator"
version = "1.0.0"
id = "artifacts/grudge-creator"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/grudge-creator/" ]
localPort = 23828

[services.development]
run = "pnpm --filter @workspace/grudge-creator run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/grudge-creator", "run", "build" ]
publicDir = "artifacts/grudge-creator/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23828"
BASE_PATH = "/grudge-creator/"
